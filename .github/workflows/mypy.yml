name: Mypy

on:
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  typing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run mypy